<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Grand Casino Royale</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0a0618;
                 font-family:'Segoe UI', Roboto, system-ui, sans-serif; }

    #wrap { position:fixed; inset:0; }
    #unity-canvas { width:100%; height:100%; display:block; background:#0a0618; }

    /* ---------- layar memuat ---------- */
    #load {
      position:fixed; inset:0; z-index:10;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:radial-gradient(ellipse at 50% 45%, #2a1250 0%, #140a2e 45%, #07040f 100%);
      transition:opacity .6s ease; padding:24px;
    }
    #load.gone { opacity:0; pointer-events:none; }

    /* garis grid sintetik di bawah, senada dengan menu game */
    #load::after{
      content:''; position:absolute; left:0; right:0; bottom:0; height:42%;
      background:
        repeating-linear-gradient(to right, rgba(0,229,255,.16) 0 1px, transparent 1px 64px),
        repeating-linear-gradient(to bottom, rgba(0,229,255,.16) 0 1px, transparent 1px 42px);
      transform:perspective(340px) rotateX(62deg); transform-origin:bottom; opacity:.55;
    }

    #title {
      position:relative; z-index:2; text-align:center;
      font-size:clamp(24px, 6vw, 54px); font-weight:800; letter-spacing:.08em;
      color:#fff; text-shadow:0 0 12px #ff2fb9, 0 0 36px #ff2fb9, 0 0 70px rgba(255,47,185,.5);
      margin-bottom:6px;
    }
    #sub { position:relative; z-index:2; color:#7de3ff; letter-spacing:.32em;
           font-size:clamp(9px, 2vw, 13px); margin-bottom:38px; text-transform:uppercase; }

    #barbox { position:relative; z-index:2; width:min(460px, 82vw); }
    #bar { height:12px; border-radius:99px; background:rgba(255,255,255,.09);
           border:1px solid rgba(125,227,255,.35); overflow:hidden; }
    #fill { height:100%; width:0%; border-radius:99px;
            background:linear-gradient(90deg,#00e5ff,#8b5cf6,#ff2fb9);
            box-shadow:0 0 18px rgba(0,229,255,.75); transition:width .25s ease; }

    #row { display:flex; justify-content:space-between; align-items:baseline; margin-top:12px; }
    #pct { color:#fff; font-size:26px; font-weight:700; }
    #stage { color:#9aa6c9; font-size:13px; }

    #tip { position:relative; z-index:2; margin-top:34px; max-width:520px; text-align:center;
           color:#c3cbe4; font-size:clamp(12px, 2.2vw, 14px); line-height:1.65; min-height:44px; }
    #tip b { color:#7de3ff; }

    #note { position:relative; z-index:2; margin-top:26px; color:#6b7593;
            font-size:12px; text-align:center; }

    /* ---------- tombol layar penuh ---------- */
    #fs { position:fixed; right:14px; bottom:14px; z-index:5; display:none;
          padding:9px 15px; border-radius:8px; cursor:pointer; color:#dfe6ff;
          background:rgba(10,6,24,.72); border:1px solid rgba(125,227,255,.4);
          font-size:13px; backdrop-filter:blur(6px); }
    #fs:hover { background:rgba(30,18,60,.9); }

    #err { position:fixed; inset:auto 0 0 0; z-index:20; display:none;
           background:#7f1d1d; color:#fff; padding:12px 16px; font-size:13px; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <div id="load">
    <div id="title">Grand Casino Royale</div>
    <div id="sub">memuat permainan</div>

    <div id="barbox">
      <div id="bar"><div id="fill"></div></div>
      <div id="row"><span id="pct">0%</span><span id="stage">menyiapkan…</span></div>
    </div>

    <div id="tip"></div>
    <div id="note">Pemuatan pertama memerlukan waktu lebih lama.<br>Kunjungan berikutnya jauh lebih cepat.</div>
  </div>

  <div id="fs">Layar penuh</div>
  <div id="err"></div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var load   = document.querySelector("#load");
    var fill   = document.querySelector("#fill");
    var pct    = document.querySelector("#pct");
    var stage  = document.querySelector("#stage");
    var tipEl  = document.querySelector("#tip");

    /* ---- tips berganti supaya menunggu tidak membosankan ---- */
    var tips = [
      "Gunakan <b>W A S D</b> untuk berjalan, tahan <b>Shift</b> untuk berlari.",
      "Tekan <b>Spasi</b> dua kali di udara untuk melakukan <b>salto</b>.",
      "Dekati kabinet arcade lalu tekan <b>E</b> untuk bermain.",
      "Tekan <b>Tab</b> kapan saja untuk membuka pengaturan.",
      "Tekan <b>M</b> untuk menampilkan peta mini.",
      "Kamu bisa mengganti karakter dan pakaiannya sebelum masuk.",
      "Main dari HP? Kontrol sentuh muncul dengan sendirinya."
    ];
    var ti = Math.floor(Math.random() * tips.length);
    function nextTip(){ tipEl.innerHTML = tips[ti % tips.length]; ti++; }
    nextTip(); setInterval(nextTip, 4200);

    // Ekstensi browser (dompet kripto, pemblokir iklan, alat otomasi, dll) menyuntikkan
    // skripnya sendiri ke setiap halaman. Kalau skrip itu error, Unity ikut menolak promise-nya
    // dan seolah-olah PERMAINAN yang gagal. Dikenali dari jejak "chrome-extension://".
    function dariEkstensi(x){
      var t = "";
      try { t = (x && x.stack) ? String(x.stack) : String(x); } catch (e) { t = ""; }
      return /(chrome|moz|safari-web|ms-browser)-extension:\/\//.test(t);
    }

    function showErr(msg){
      var e = document.querySelector("#err");
      e.style.display = "block";
      e.textContent = msg;
    }

    var buildUrl = "Build";
    var vCache = "?v=20260822a";   // ganti kalau build baru, biar cache browser tidak nyangkut
    var config = {
      arguments: [],
      dataUrl:      buildUrl + "/Web.data.unityweb" + vCache,
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb" + vCache,
      codeUrl:      buildUrl + "/Web.wasm.unityweb" + vCache,
      streamingAssetsUrl: "StreamingAssets",
      companyName:    "SutriSanti",
      productName:    "Grand Casino Royale",
      productVersion: "0.1",
      showBanner: function(msg, type){
        if (type !== 'error') return;
        if (dariEkstensi(msg)) return;   // error dari ekstensi browser, bukan dari permainan
        showErr(msg);
      }
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      document.querySelector("meta[name=viewport]").content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no";
    }

    var script = document.createElement("script");
    script.src = buildUrl + "/Web.loader.js" + vCache;

    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        var v = Math.round(p * 100);
        fill.style.width = v + "%";
        pct.textContent  = v + "%";
        // keterangan tahap, supaya jelas bukan macet
        if (v < 92)       stage.textContent = "mengunduh berkas…";
        else if (v < 100) stage.textContent = "menyiapkan permainan…";
        else              stage.textContent = "hampir siap…";
      }).then(function (unityInstance) {
        load.classList.add("gone");
        setTimeout(function(){ load.style.display = "none"; }, 700);
        var fs = document.querySelector("#fs");
        fs.style.display = "block";
        fs.onclick = function(){ unityInstance.SetFullscreen(1); };
      }).catch(function (message) {
        if (dariEkstensi(message)) {
          showErr("Permainan tidak bisa dijalankan karena ada EKSTENSI BROWSER di profil ini yang "
                + "menghalanginya. Coba buka lewat jendela Penyamaran (Incognito), atau matikan "
                + "ekstensi untuk halaman ini lalu muat ulang. Bukan masalah koneksi atau server.");
        } else {
          showErr("Gagal memuat: " + message);
        }
      });
    };

    script.onerror = function () {
      showErr("Berkas permainan tidak dapat diunduh. Periksa koneksi internet lalu muat ulang halaman.");
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
